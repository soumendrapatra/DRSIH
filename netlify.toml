[build]
  command = "npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/images"
  to = "/.netlify/functions/images"
  status = 200

[[redirects]]
  from = "/api/analysis/:id"
  to = "/.netlify/functions/analysis?id=:id"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
